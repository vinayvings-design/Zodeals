name: Build Android app (zodeals_app)

# Builds an installable APK from the React Native app. Does NOT deploy anything
# and does not touch the backend or the websites.
on:
  workflow_dispatch:
  push:
    branches: [customer-native-app]
    paths: ['zodeals_app/**', '.github/workflows/build-android-app.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zodeals_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Align Expo package versions
        run: npx expo install --fix
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: zodeals_app/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zodeals-android-apk
          path: zodeals_app/android/app/build/outputs/apk/release/*.apk
